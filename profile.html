<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Tree - Profile</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #2e7d32;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 12px;
            border: 3px solid #c8e6c9;
        }
        .profile-name {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #1b5e20;
        }
        .profile-email {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .input-group label i {
            color: #2e7d32;
            width: 18px;
            margin-right: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: #fafafa;
            transition: border 0.2s;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #2e7d32;
            outline: none;
            background: white;
        }
        .input-group input:disabled {
            background: #f0f0f0;
            color: #666;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #2e7d32; color: white; }
        .btn-primary:hover { background: #1b5e20; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-outline { background: transparent; color: #2e7d32; border: 2px solid #2e7d32; }
        .btn-outline:hover { background: #e8f5e9; }
        .btn i { margin-right: 6px; }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 0 0 0;
            border-top: 1px solid #e0e0e0;
            margin-top: 24px;
        }
        .nav-bar a {
            text-decoration: none;
            color: #888;
            font-size: 11px;
            text-align: center;
            flex: 1;
            padding: 6px 0;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-bar a i {
            display: block;
            font-size: 20px;
            margin-bottom: 2px;
        }
        .nav-bar a.active {
            color: #2e7d32;
            font-weight: 600;
            background: #e8f5e9;
        }
        .nav-bar a:hover:not(.active) {
            color: #1b5e20;
            background: #f0f4f0;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-header h1 { color: #1b5e20; font-size: 22px; }
        .page-header h1 i { color: #2e7d32; margin-right: 6px; }
        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge i { margin-right: 4px; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }
        #message {
            margin: 12px 0 16px 0;
            font-size: 14px;
            min-height: 24px;
            font-weight: 500;
        }
        .success { color: #2e7d32; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>

<div class="container" style="max-width: 450px;">
    <div class="page-header">
        <h1><i class="fas fa-user"></i> My Profile</h1>
        <span class="badge" id="kycBadge"><i class="fas fa-clock"></i> Pending</span>
    </div>

    <div id="message"></div>

    <div class="profile-avatar" id="avatar">👤</div>
    <div class="profile-name" id="displayName">Loading...</div>
    <div class="profile-email" id="displayEmail">Loading...</div>

    <div class="input-group">
        <label><i class="fas fa-phone-alt"></i> Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="0977123456" />
    </div>

    <div class="input-group">
        <label><i class="fas fa-id-card"></i> NRC Number</label>
        <input type="text" id="nrcNumber" placeholder="e.g., 123456/78/1" />
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="updateProfile"><i class="fas fa-save"></i> Update</button>
        <button class="btn btn-outline" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-left"></i> Back</button>
    </div>

    <button class="btn btn-danger" onclick="logout()" style="margin-top:12px;">
        <i class="fas fa-sign-out-alt"></i> Logout
    </button>

    <div class="nav-bar">
        <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
        <a href="apply.html"><i class="fas fa-paper-plane"></i> Apply</a>
        <a href="repay.html"><i class="fas fa-hand-holding-usd"></i> Repay</a>
        <a href="profile.html" class="active"><i class="fas fa-user"></i> Profile</a>
        <a href="admin.html"><i class="fas fa-lock"></i> Admin</a>
    </div>
</div>

<script src="config.js"></script>
<script>
auth.onAuthStateChanged(async function(user) {
    if (!user) {
        window.location.href = 'index.html';
        return;
    }

    try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
            const data = userDoc.data();
            document.getElementById('displayName').textContent = data.fullName || user.displayName || 'User';
            document.getElementById('displayEmail').textContent = data.email || user.email || 'No email';
            document.getElementById('phoneNumber').value = data.phoneNumber || '';
            document.getElementById('nrcNumber').value = data.nrcNumber || '';
            
            const initials = (data.fullName || 'User').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            document.getElementById('avatar').textContent = initials || '👤';
            
            const kycStatus = data.kycStatus || 'pending';
            const badge = document.getElementById('kycBadge');
            if (kycStatus === 'verified') {
                badge.innerHTML = '<i class="fas fa-check-circle"></i> Verified';
                badge.style.background = '#e8f5e9';
                badge.style.color = '#2e7d32';
            } else {
                badge.innerHTML = '<i class="fas fa-clock"></i> Pending';
                badge.style.background = '#fff3e0';
                badge.style.color = '#e65100';
            }
        }
    } catch (error) {
        console.error('Error loading profile:', error);
    }
});

document.getElementById('updateProfile').addEventListener('click', async function() {
    const user = auth.currentUser;
    if (!user) return;

    const phoneNumber = document.getElementById('phoneNumber').value.trim();
    const nrcNumber = document.getElementById('nrcNumber').value.trim();

    try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        
        if (!userDoc.exists) {
            await db.collection('users').doc(user.uid).set({
                fullName: user.displayName || '',
                email: user.email || '',
                phoneNumber: phoneNumber,
                nrcNumber: nrcNumber,
                role: 'user',
                kycStatus: 'pending',
                loanLimit: 0,
                createdAt: new Date().toISOString()
            });
            document.getElementById('message').innerHTML = '✅ Profile created successfully!';
            document.getElementById('message').style.color = '#2e7d32';
            setTimeout(() => location.reload(), 1500);
            return;
        }

        await db.collection('users').doc(user.uid).update({
            phoneNumber: phoneNumber,
            nrcNumber: nrcNumber,
            updatedAt: new Date().toISOString()
        });
        document.getElementById('message').innerHTML = '✅ Profile updated successfully!';
        document.getElementById('message').style.color = '#2e7d32';
        setTimeout(() => { document.getElementById('message').textContent = ''; }, 3000);
    } catch (error) {
        console.error('Error:', error);
        alert('Error: ' + error.message);
    }
});

function logout() {
    auth.signOut().then(() => {
        window.location.href = 'index.html';
    });
}
</script>

</body>
</html>
