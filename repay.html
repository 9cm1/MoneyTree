<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Tree - Repay</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #e8f5e9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        /* ===== HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-header h1 {
            color: #1b5e20;
            font-size: 22px;
        }
        .page-header h1 i {
            color: #2e7d32;
            margin-right: 6px;
        }
        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge i { margin-right: 4px; }

        /* ===== LOAN ITEMS ===== */
        .loan-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #f8faf8;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #2196f3;
        }
        .loan-item .info .amount {
            font-weight: 700;
            font-size: 16px;
            color: #1b5e20;
        }
        .loan-item .info .details {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        .loan-item .info .details i {
            color: #2e7d32;
            margin-right: 4px;
        }
        .status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-active { background: #e3f2fd; color: #0d47a1; }
        .status-overdue { background: #fce4ec; color: #c62828; }
        .status-paid { background: #e8f5e9; color: #2e7d32; }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state i {
            font-size: 48px;
            color: #c8e6c9;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== REPAY GUIDE ===== */
        .repay-guide {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
        }
        .repay-guide h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }
        .repay-guide h3 i {
            color: #2e7d32;
            margin-right: 6px;
        }
        .repay-guide ol {
            font-size: 13px;
            color: #555;
            padding-left: 20px;
            line-height: 1.8;
            margin: 0;
        }
        .repay-guide ol li i {
            color: #2e7d32;
            margin-right: 4px;
        }

        /* ===== NAVIGATION ===== */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 0 0 0;
            border-top: 1px solid #e0e0e0;
            margin-top: 24px;
        }
        .nav-bar a {
            text-decoration: none;
            color: #888;
            font-size: 11px;
            text-align: center;
            flex: 1;
            padding: 6px 0;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-bar a i {
            display: block;
            font-size: 20px;
            margin-bottom: 2px;
        }
        .nav-bar a.active {
            color: #2e7d32;
            font-weight: 600;
            background: #e8f5e9;
        }
        .nav-bar a:hover:not(.active) {
            color: #1b5e20;
            background: #f0f4f0;
        }

        /* ===== MESSAGES ===== */
        #message {
            margin: 12px 0 16px 0;
            font-size: 14px;
            min-height: 24px;
            font-weight: 500;
        }
        .success { color: #2e7d32; }
        .error { color: #d32f2f; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 16px 14px; }
            .page-header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1><i class="fas fa-hand-holding-usd"></i> Repay Loan</h1>
        <span class="badge"><i class="fas fa-credit-card"></i> Payment</span>
    </div>

    <div id="message"></div>

    <div id="activeLoans">
        <div style="text-align:center;padding:20px;color:#999;">
            <i class="fas fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:8px;"></i>
            Loading...
        </div>
    </div>

    <!-- Repayment Guide -->
    <div class="repay-guide">
        <h3><i class="fas fa-info-circle"></i> How to Repay</h3>
        <ol>
            <li><i class="fas fa-phone-alt"></i> Dial <strong>*115#</strong> (Airtel) or <strong>*303#</strong> (MTN)</li>
            <li><i class="fas fa-list"></i> Select <strong>Goods &amp; Services</strong></li>
            <li><i class="fas fa-arrow-right"></i> Select <strong>Make Payment</strong></li>
            <li><i class="fas fa-hashtag"></i> Merchant Code: <strong>MONEYTREE</strong></li>
            <li><i class="fas fa-id-card"></i> Reference: Your <strong>NRC</strong> (no slashes)</li>
            <li><i class="fas fa-money-bill-wave"></i> Enter amount and confirm</li>
        </ol>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
        <a href="apply.html"><i class="fas fa-paper-plane"></i> Apply</a>
        <a href="repay.html" class="active"><i class="fas fa-hand-holding-usd"></i> Repay</a>
        <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
        <a href="admin.html"><i class="fas fa-lock"></i> Admin</a>
    </div>
</div>

<script src="config.js"></script>
<script>
auth.onAuthStateChanged(async function(user) {
    if (!user) {
        window.location.href = 'index.html';
        return;
    }

    try {
        const loansSnapshot = await db.collection('loans')
            .where('userId', '==', user.uid)
            .where('status', 'in', ['approved', 'disbursed', 'active'])
            .get();

        const container = document.getElementById('activeLoans');

        if (loansSnapshot.empty) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-check-circle"></i>
                    <p>You have no active loans to repay.</p>
                </div>
            `;
            return;
        }

        let html = '';
        loansSnapshot.forEach(doc => {
            const loan = doc.data();
            const dueDate = loan.dueDate ? new Date(loan.dueDate).toLocaleDateString() : 'N/A';
            const isOverdue = loan.dueDate && new Date(loan.dueDate) < new Date();
            const statusClass = isOverdue ? 'status-overdue' : 'status-active';
            const statusLabel = isOverdue ? 'Overdue' : 'Active';
            
            html += `
                <div class="loan-item" style="border-left-color: ${isOverdue ? '#f44336' : '#2196f3'}">
                    <div class="info">
                        <div class="amount">K ${(loan.totalRepay || loan.amount || 0).toFixed(2)}</div>
                        <div class="details">
                            <i class="fas fa-calendar-alt"></i> Due: ${dueDate}
                            ${loan.purpose ? `• <i class="fas fa-tag"></i> ${loan.purpose}` : ''}
                        </div>
                    </div>
                    <span class="status-badge ${statusClass}">${statusLabel}</span>
                </div>
            `;
        });
        container.innerHTML = html;

    } catch (error) {
        console.error('Error loading loans:', error);
        document.getElementById('activeLoans').innerHTML = `
            <div style="text-align:center;padding:20px;color:#d32f2f;">
                <i class="fas fa-exclamation-circle"></i> Error loading loans
            </div>
        `;
    }
});
</script>

</body>
</html>
